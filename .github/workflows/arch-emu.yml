# This workflow is modified from a similar one used by SuiteSparse
# https://github.com/DrTimothyAldenDavis/SuiteSparse/blob/dev/.github/workflows/build-arch-emu.yaml

name: Emulated

# Build once at 2 AM UTC every day, as well as on demand.
# See the Checkout action below to control which branch
# the scheduled build happens on.
#
# Failures of scheduled runs are reported by GitHub to the user who last
# edited the cron line below, so keep that in mind when changing it.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency: ci-arch-emu-${{ github.ref }}

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_COLOR_DIAGNOSTICS: ON
  CCACHE_MAXSIZE: 64M
  OMP_NUM_THREADS: 1
  CTEST_PARALLEL_LEVEL: 2 # No more than two tests running at a time to prevent timeouts

jobs:

  alpine:
    runs-on: ubuntu-latest

    # Do not run in forks (necessary because of scheduled runs)
    if: github.repository == 'igraph/igraph'

    defaults:
      run:
        # Use emulated shell as default. Steps that must run on the host
        # runner set `shell: bash` explicitly.
        shell: alpine.sh {0}

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        # For available CPU architectures, see:
        # https://github.com/marketplace/actions/setup-alpine-linux-environment
        arch: [x86, aarch64, armhf, armv7, loongarch64, ppc64le, s390x, riscv64]

    name: alpine (${{ matrix.arch }})

    steps:
      - name: CPU information (host)
        shell: bash
        run: lscpu

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}

      - name: Install dependencies
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          packages: >
            build-base
            git
            ninja
            bison
            flex
            ccache
            cmake
            glpk-dev
            gmp-dev
            arpack-dev
            libxml2-dev
            util-linux

      - name: CPU information (emulated)
        run: lscpu

      - name: Prepare cache
        # Create a unique key with a human-readable timestamp, used by the
        # restore and save steps below. The restore step falls back to the
        # most recent cache with a matching prefix.
        id: ccache-prepare
        shell: bash
        run: |
          echo "key=ccache:alpine:${{ matrix.arch }}:${{ github.ref }}:$(date -u +"%Y-%m-%d_%H-%M-%S")" >> "$GITHUB_OUTPUT"

      - name: Configure ccache
        run: |
          test -d ~/.ccache || mkdir ~/.ccache
          echo "compression = true" >> ~/.ccache/ccache.conf
          ccache -s
          which ccache

      - name: Restore cache
        # Set up the GitHub cache used to maintain the ccache from one job to the next
        id: restore
        uses: actions/cache/restore@v6
        with:
          # location of the ccache of the chroot in the root file system
          path: /home/runner/rootfs/alpine-latest-${{ matrix.arch }}/home/runner/.ccache
          key: ${{ steps.ccache-prepare.outputs.key }}
          # Prefer the newest cache from the same ref. Fall back to the newest
          # cache for this architecture from any ref.
          restore-keys: |
            ccache:alpine:${{ matrix.arch }}:${{ github.ref }}:
            ccache:alpine:${{ matrix.arch }}:

      - name: Configure
        run: |
          echo "gcc --version"
          gcc --version
          echo "gcc -dumpmachine"
          gcc -dumpmachine
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DIGRAPH_ENABLE_TLS=ON \
                -DIGRAPH_USE_INTERNAL_BLAS=OFF \
                -DIGRAPH_USE_INTERNAL_LAPACK=OFF \
                -DIGRAPH_USE_INTERNAL_ARPACK=OFF \
                -DIGRAPH_USE_INTERNAL_GLPK=OFF \
                -DIGRAPH_USE_INTERNAL_GMP=OFF \
                -DIGRAPH_USE_INTERNAL_PLFIT=ON \
                ..

      - name: Build
        run: cd build && cmake --build . --target build_tests --parallel

      - name: Test
        # Emulated runs are slow. ctest's default per-test timeout has been
        # sufficient so far; add --timeout here if tests start timing out.
        run: cd build && ctest --output-on-failure

      - name: Ccache statistics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache -s

      - name: Cache
        # Save the cache even if the Build or Test steps failed, so that a
        # failing day does not also throw away the warm ccache. Skipped if
        # the job was cancelled or setup failed before the cache was restored.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: /home/runner/rootfs/alpine-latest-${{ matrix.arch }}/home/runner/.ccache
          key: ${{ steps.ccache-prepare.outputs.key }}